---
name: Reusable On Push

on:
  workflow_call:

jobs:
  detect-codeql-languages:
    name: Detect CodeQL languages
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.detect.outputs.languages }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect supported languages
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          languages=()

          if find . -type f -name '*.py' -print -quit | grep -q .; then
            languages+=(python)
          fi

          if find . -type f \( \
            -name '*.js' -o \
            -name '*.jsx' -o \
            -name '*.mjs' -o \
            -name '*.cjs' -o \
            -name '*.ts' -o \
            -name '*.tsx' \
          \) -print -quit | grep -q .; then
            languages+=(javascript-typescript)
          fi

          if (( ${#languages[@]} == 0 )); then
            echo "No Python or JavaScript/TypeScript source files were found" >&2
            exit 1
          fi

          languages_json="$(jq --compact-output --null-input '$ARGS.positional' --args -- "${languages[@]}")"
          echo "Detected CodeQL languages: $languages_json"
          echo "languages=$languages_json" >> "$GITHUB_OUTPUT"

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: detect-codeql-languages
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect-codeql-languages.outputs.languages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.9

  filesystem-scan:
    name: Scan repository filesystem
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan repository filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  test:
    name: Validate test target
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test target
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: test
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max,ignore-error=true

  image-scan:
    name: Scan runtime image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime target
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          load: true
          tags: ${{ github.repository }}:ci-runtime
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max,ignore-error=true

      - name: Scan runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ github.repository }}:ci-runtime
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  required-check:
    name: Required
    needs:
      - codeql
      - filesystem-scan
      - test
      - image-scan
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify all checks passed
        env:
          CODEQL_RESULT: ${{ needs.codeql.result }}
          FILESYSTEM_SCAN_RESULT: ${{ needs.filesystem-scan.result }}
          TEST_RESULT: ${{ needs.test.result }}
          IMAGE_SCAN_RESULT: ${{ needs.image-scan.result }}
        shell: bash
        run: |
          for result in \
            "$CODEQL_RESULT" \
            "$FILESYSTEM_SCAN_RESULT" \
            "$TEST_RESULT" \
            "$IMAGE_SCAN_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              echo "A required job finished with: $result"
              exit 1
            fi
          done

          echo "All required checks passed."
