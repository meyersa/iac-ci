---
name: Reusable On Merge

on:
  workflow_call:

jobs:
  publish:
    name: Build and publish runtime image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read package version
        id: version
        shell: bash
        run: |
          version=""

          if [[ -f package.json ]]; then
            version="$(jq -r '.version // empty' package.json)"
          fi

          if [[ -z "$version" && -f pyproject.toml ]]; then
            version="$(awk -F'"' '/^version = "/ { print $2; exit }' pyproject.toml)"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set runtime image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=${{ github.sha }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish runtime target
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max,ignore-error=true
          platforms: linux/amd64,linux/arm64/v8

  update-deployment:
    name: Open deployment PR
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: iac-cd
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout deployment repository
        uses: actions/checkout@v7
        with:
          repository: meyersa/iac-cd
          token: ${{ steps.app-token.outputs.token }}
          path: iac-cd

      - name: Read app user ID
        id: app-user
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "id=$user_id" >> "$GITHUB_OUTPUT"

      - name: Find and update deployment image
        id: image
        working-directory: iac-cd
        shell: bash
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"

          mapfile -t manifests < <(
            git grep -l -F "$IMAGE_REPOSITORY:" -- '*.yml' '*.yaml' || true
          )

          if (( ${#manifests[@]} == 0 )); then
            echo "No YAML manifest references $IMAGE_REPOSITORY; skipping deployment update"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          search_repository="${IMAGE_REPOSITORY//./\\.}"
          sed -i -E \
            "s|${search_repository}:[^[:space:]\"']+|${IMAGE}|g" \
            "${manifests[@]}"

          git grep -n -F "$IMAGE" -- "${manifests[@]}"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "short-sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Create deployment pull request
        if: steps.image.outputs.found == 'true'
        working-directory: iac-cd
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.app-user.outputs.id }}
          IMAGE: ${{ steps.image.outputs.image }}
          SHORT_SHA: ${{ steps.image.outputs.short-sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image_name="${GITHUB_REPOSITORY#*/}"
          branch="deploy/${image_name}"
          remote_sha="$(git ls-remote --heads origin "$branch" | awk '{ print $1 }')"

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -u
          git commit -m "deploy ${image_name} ${SHORT_SHA}"

          if [[ -n "$remote_sha" ]]; then
            git push \
              --force-with-lease="refs/heads/${branch}:${remote_sha}" \
              origin "HEAD:${branch}"
          else
            git push origin "HEAD:${branch}"
          fi

          pr_number="$(
            gh pr list \
              --repo meyersa/iac-cd \
              --head "$branch" \
              --base main \
              --state open \
              --json number \
              --jq '.[0].number'
          )"

          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --repo meyersa/iac-cd \
              --base main \
              --head "$branch" \
              --title "Deploy ${image_name} ${SHORT_SHA}" \
              --body "Updates ${IMAGE} from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SOURCE_SHA}."
          else
            gh pr edit "$pr_number" \
              --repo meyersa/iac-cd \
              --title "Deploy ${image_name} ${SHORT_SHA}" \
              --body "Updates ${IMAGE} from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SOURCE_SHA}."
          fi
